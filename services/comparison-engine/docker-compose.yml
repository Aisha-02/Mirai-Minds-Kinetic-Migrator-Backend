services:
  comparison-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: comparison-engine:latest
    container_name: comparison-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      COMPARISON_HOST: 0.0.0.0
      COMPARISON_PORT: 8080
      COMPARISON_DOWNLOAD_DIR: /tmp/comparison-engine
    volumes:
      - comparison-downloads:/tmp/comparison-engine
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  comparison-downloads:
